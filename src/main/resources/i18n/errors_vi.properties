# Message tiếng Việt cho mã lỗi của Forwarder (ForwarderErrorCode, HYD-40-xxx).
error.VALIDATION_ERROR=Dữ liệu yêu cầu không hợp lệ.
error.UNAUTHORIZED=Xác thực đối tác không thành công.
error.REQUEST_EXPIRED=Yêu cầu đã hết hạn. Vui lòng kiểm tra đồng hồ hệ thống và gửi lại với X-Timestamp mới.
error.DUPLICATE_TRANSACTION=Mã giao dịch (transactionKey) đã được sử dụng.
error.API_NOT_FOUND=Không tìm thấy API yêu cầu.
error.API_NOT_ALLOWED=Đối tác không được phép gọi API này.
error.SERVER_ERROR=Hệ thống đang bận, vui lòng thử lại sau.
error.SERVICE_UNAVAILABLE=Hệ thống đang bận, vui lòng thử lại sau.
error.GATEWAY_TIMEOUT=Hệ thống phản hồi chậm, vui lòng thử lại sau.
error.DOWNSTREAM_REJECTED=Hệ thống đang bận, vui lòng thử lại sau.
