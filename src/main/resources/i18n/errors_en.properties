error.API_NOT_FOUND=The requested API was not found.
error.API_NOT_ALLOWED=The partner is not allowed to call this API.
error.SERVER_ERROR=The system is busy, please try again later.
error.SERVICE_UNAVAILABLE=The system is busy, please try again later.
error.GATEWAY_TIMEOUT=The system is responding slowly, please try again later.
error.DOWNSTREAM_REJECTED=The system is busy, please try again later.
