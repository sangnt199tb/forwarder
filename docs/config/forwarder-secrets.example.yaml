# Mẫu file secret của Forwarder. Chép thành %USERPROFILE%\.ebank\forwarder-secrets.yaml (ngoài repo) rồi điền giá trị thật.
# Không commit file thật lên git. Thiếu file thì Forwarder không khởi động.
forwarder:
  gateway-token:
    # Khoá bí mật RSA 2048 (PKCS#8, DER, Base64 một dòng) để ký token gửi API Gateway.
    # Khoá công khai tương ứng đặt ở gateway.forwarder.public-key trong ebank-shared-secrets.yaml của eBank.
    # Tạo cặp khoá RIÊNG cho Forwarder (Git Bash), không dùng lại khoá của auth-service:
    #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out fwd-private.pem
    #   openssl pkcs8 -topk8 -nocrypt -in fwd-private.pem -outform DER -out fwd-private.der
    #   openssl pkey -in fwd-private.pem -pubout -outform DER -out fwd-public.der
    #   base64 -w0 fwd-private.der   -> giá trị private-key ở đây
    #   base64 -w0 fwd-public.der    -> gateway.forwarder.public-key
    # rồi xoá 3 file .pem, .der.
    private-key: <base64-pkcs8-private-key>
